name: Pipeline CI/CD DistritoCosmetico - SOFT-17 - Caso de estudio 3

on:
  push:
    branches: [ "main", "master", "feature/ci-cd" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  PORT: 5000
  NODE_ENV: test
  API_URL: http://127.0.0.1:5000/api
  MONGODB_URI: mongodb://127.0.0.1:27017/cenfotec_test_db
  JWT_SECRET: secreto_solo_para_pruebas_ci
  ADMIN_EMAIL: admin@test.com
  ADMIN_PASSWORD: Password123!

jobs:
  test-and-analyze:
    name: Pruebas unitarias, pruebas de API y análisis de SonarQube
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: 1. Checkout del código fuente
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Instalar dependencias
        run: npm ci

      - name: 4. Pruebas unitarias y de API con cobertura
        run: ./scripts/ci/run-api-tests.sh

      - name: 5. Análisis estático y Quality Gate (SonarQube Cloud)
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.qualitygate.wait=true
