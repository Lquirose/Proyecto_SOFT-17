name: Pipeline CI/CD DistritoCosmetico - SOFT-17 - Caso de estudio 3

on:
  push:
    branches: [ "main", "master", "feature/ci-cd" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-analyze:
    name: Pruebas de API y análisis de SonarQube
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
      - name: 1. Checkout del código fuente
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Instalar dependencias
        run: npm ci

      - name: 4. Iniciar Servidor de la API y Ejecutar Pruebas Funcionales
        env:
          PORT: 5000
          NODE_ENV: test
          BASE_URL: http://127.0.0.1:5000/api
          API_URL: http://127.0.0.1:5000/api
          SERVER_URL: http://127.0.0.1:5000
          MONGO_URI: mongodb://127.0.0.1:27017/cenfotec_test_db
          MONGODB_URI: mongodb://127.0.0.1:27017/cenfotec_test_db
          DB_URI: mongodb://127.0.0.1:27017/cenfotec_test_db
          JWT_SECRET: super_secret_token_key_cenfotec_2026
          SESSION_SECRET: super_secret_token_key_cenfotec_2026
        run: |
          # 1. Poblar la BD garantizando soporte de crypto
          node --enable-source-maps src/seed/seed.js || true

          # 2. Levantar la API en segundo plano
          node src/server.js &
          SERVER_PID=$!
          
          # 3. Esperar a que el servidor inicialice la BD y el puerto
          sleep 6
          
          # 4. Ejecutar la suite completa de Jest
          npx jest src/tests/specs --coverage --detectOpenHandles --forceExit
          TEST_EXIT_CODE=$?
          
          # 5. Finalizar proceso de la API
          kill -9 $SERVER_PID || true
          
          # 6. Salir con el estado real de Jest
          exit $TEST_EXIT_CODE

      - name: 5. Análisis estático de código con SonarQube
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}